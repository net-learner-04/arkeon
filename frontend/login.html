<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arkeon</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none'><rect width='120' height='120' rx='28' fill='%230e7490'/><polygon points='60,18 95,38 95,78 60,98 25,78 25,38' stroke='white' stroke-width='4' fill='none' opacity='.95'/><polygon points='60,34 80,45 80,68 60,80 40,68 40,45' stroke='white' stroke-width='2.5' fill='white' opacity='.18'/><line x1='60' y1='18' x2='60' y2='34' stroke='white' stroke-width='2' opacity='.55'/><line x1='95' y1='38' x2='80' y2='45' stroke='white' stroke-width='2' opacity='.55'/><line x1='95' y1='78' x2='80' y2='68' stroke='white' stroke-width='2' opacity='.55'/><line x1='60' y1='98' x2='60' y2='80' stroke='white' stroke-width='2' opacity='.55'/><line x1='25' y1='78' x2='40' y2='68' stroke='white' stroke-width='2' opacity='.55'/><line x1='25' y1='38' x2='40' y2='45' stroke='white' stroke-width='2' opacity='.55'/><circle cx='60' cy='57' r='10' fill='white' opacity='.95'/></svg>"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="bg-canvas"><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div></div>

  <nav class="topbar-global">
    <a href="/" class="nav-logo">
      <svg class="nav-logo-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="120" height="120" rx="28" fill="url(#lg1)"/>
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
        <polygon points="60,18 95,38 95,78 60,98 25,78 25,38" stroke="white" stroke-width="4" fill="none" opacity=".95"/>
        <polygon points="60,34 80,45 80,68 60,80 40,68 40,45" stroke="white" stroke-width="2.5" fill="white" opacity=".18"/>
        <line x1="60" y1="18" x2="60" y2="34" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="95" y1="38" x2="80" y2="45" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="95" y1="78" x2="80" y2="68" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="60" y1="98" x2="60" y2="80" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="25" y1="78" x2="40" y2="68" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="25" y1="38" x2="40" y2="45" stroke="white" stroke-width="2" opacity=".55"/>
        <circle cx="60" cy="57" r="10" fill="white" opacity=".95"/>
      </svg>
      Arkeon
    </a>
    <div class="nav-right">
      <button class="theme-toggle"></button>
      <a href="register.html" class="btn-nav-ghost">Request access</a>
    </div>
  </nav>

  <div class="auth-page page">
    <div class="glass auth-card">
      <a href="/" class="auth-logo">
        <svg class="auth-logo-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="120" height="120" rx="28" fill="url(#lg2)"/>
          <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
          <polygon points="60,18 95,38 95,78 60,98 25,78 25,38" stroke="white" stroke-width="4" fill="none" opacity=".95"/>
          <polygon points="60,34 80,45 80,68 60,80 40,68 40,45" stroke="white" stroke-width="2.5" fill="white" opacity=".18"/>
          <line x1="60" y1="18" x2="60" y2="34" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="95" y1="38" x2="80" y2="45" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="95" y1="78" x2="80" y2="68" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="60" y1="98" x2="60" y2="80" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="25" y1="78" x2="40" y2="68" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="25" y1="38" x2="40" y2="45" stroke="white" stroke-width="2" opacity=".55"/>
          <circle cx="60" cy="57" r="10" fill="white" opacity=".95"/>
        </svg>
        <span>Arkeon</span>
      </a>

      <!-- Login -->
      <div id="loginSection">
        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-sub">Sign in to your private cloud</p>
        <div id="alert" class="alert" style="margin-bottom:1rem;"></div>
        <div class="form-stack">
          <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="your@email.com" autocomplete="email"/></div>
          <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/></div>
          <button class="btn btn-primary" id="loginBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Sign In
          </button>
        </div>
        <div class="auth-footer">Don't have an account? <a href="register.html">Request access</a></div>
      </div>

      <!-- Dormant notice -->
      <div id="dormantSection" style="display:none;text-align:center;">
        <div style="width:60px;height:60px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:1.6rem;">😴</div>
        <h1 class="auth-heading" style="font-size:1.35rem;">Account Dormant</h1>
        <p class="auth-sub" style="margin-bottom:1.5rem;">Your account has been inactive for 30+ days and has been placed in dormant status. Please contact the administrator to reactivate your account.</p>
        <button onclick="showLogin()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:0.82rem;">← Back to sign in</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (auth.getToken()) window.location.href = "dashboard.html";

    const alertEl = document.getElementById("alert");
    const loginBtn = document.getElementById("loginBtn");

    function showLogin() {
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("dormantSection").style.display = "none";
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) { showAlert(alertEl, "Please fill in all fields."); return; }
      loginBtn.disabled = true;
      loginBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 0.8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Signing in...`;
      hideAlert(alertEl);

      const res = await fetch(`${API}/api/user/login`, {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: new URLSearchParams({username: email, password})
      });
      const data = await res.json();

      if (res.ok) {
        auth.setToken(data.access_token);
        const meRes = await fetch(`${API}/api/user/me`, {headers:{Authorization:`Bearer ${data.access_token}`}});
        const me = await meRes.json();
        auth.setUser({name: me.name, is_admin: me.is_admin, id: me.id, profile_image: me.profile_image});
        window.location.href = "dashboard.html";
      } else if (res.status === 403 && data.detail === "dormant") {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("dormantSection").style.display = "block";
      } else {
        showAlert(alertEl, data.detail || "Incorrect email or password.");
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In`;
      }
    }

    loginBtn.addEventListener("click", login);
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && document.getElementById("loginSection").style.display !== "none") login();
    });
  </script>
  <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
</body>
</html>
