<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arkeon</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none'><rect width='120' height='120' rx='28' fill='%230e7490'/><polygon points='60,18 95,38 95,78 60,98 25,78 25,38' stroke='white' stroke-width='4' fill='none' opacity='.95'/><polygon points='60,34 80,45 80,68 60,80 40,68 40,45' stroke='white' stroke-width='2.5' fill='white' opacity='.18'/><line x1='60' y1='18' x2='60' y2='34' stroke='white' stroke-width='2' opacity='.55'/><line x1='95' y1='38' x2='80' y2='45' stroke='white' stroke-width='2' opacity='.55'/><line x1='95' y1='78' x2='80' y2='68' stroke='white' stroke-width='2' opacity='.55'/><line x1='60' y1='98' x2='60' y2='80' stroke='white' stroke-width='2' opacity='.55'/><line x1='25' y1='78' x2='40' y2='68' stroke='white' stroke-width='2' opacity='.55'/><line x1='25' y1='38' x2='40' y2='45' stroke='white' stroke-width='2' opacity='.55'/><circle cx='60' cy='57' r='10' fill='white' opacity='.95'/></svg>"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="bg-canvas"><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div></div>

  <nav class="topbar-global">
    <a href="/" class="nav-logo">
      <svg class="nav-logo-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="120" height="120" rx="28" fill="url(#rg1)"/>
        <defs><linearGradient id="rg1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
        <polygon points="60,18 95,38 95,78 60,98 25,78 25,38" stroke="white" stroke-width="4" fill="none" opacity=".95"/>
        <polygon points="60,34 80,45 80,68 60,80 40,68 40,45" stroke="white" stroke-width="2.5" fill="white" opacity=".18"/>
        <line x1="60" y1="18" x2="60" y2="34" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="95" y1="38" x2="80" y2="45" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="95" y1="78" x2="80" y2="68" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="60" y1="98" x2="60" y2="80" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="25" y1="78" x2="40" y2="68" stroke="white" stroke-width="2" opacity=".55"/>
        <line x1="25" y1="38" x2="40" y2="45" stroke="white" stroke-width="2" opacity=".55"/>
        <circle cx="60" cy="57" r="10" fill="white" opacity=".95"/>
      </svg>
      Arkeon
    </a>
    <div class="nav-right">
      <button class="theme-toggle"></button>
      <a href="login.html" class="btn-nav-ghost">Sign In</a>
    </div>
  </nav>

  <div class="auth-page page">
    <div class="glass auth-card">
      <a href="/" class="auth-logo">
        <svg class="auth-logo-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="120" height="120" rx="28" fill="url(#rg2)"/>
          <defs><linearGradient id="rg2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
          <polygon points="60,18 95,38 95,78 60,98 25,78 25,38" stroke="white" stroke-width="4" fill="none" opacity=".95"/>
          <polygon points="60,34 80,45 80,68 60,80 40,68 40,45" stroke="white" stroke-width="2.5" fill="white" opacity=".18"/>
          <line x1="60" y1="18" x2="60" y2="34" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="95" y1="38" x2="80" y2="45" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="95" y1="78" x2="80" y2="68" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="60" y1="98" x2="60" y2="80" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="25" y1="78" x2="40" y2="68" stroke="white" stroke-width="2" opacity=".55"/>
          <line x1="25" y1="38" x2="40" y2="45" stroke="white" stroke-width="2" opacity=".55"/>
          <circle cx="60" cy="57" r="10" fill="white" opacity=".95"/>
        </svg>
        <span>Arkeon</span>
      </a>

      <!-- Form -->
      <div id="formSection">
        <h1 class="auth-heading">Request access</h1>
        <p class="auth-sub">Fill in your details. An administrator will review and approve your request.</p>
        <div id="alert" class="alert" style="margin-bottom:1rem;"></div>
        <div class="form-stack">
          <div class="form-group"><label>Username</label><input type="text" id="regName" placeholder="Choose a username" autocomplete="username"/></div>
          <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email"/></div>
          <div class="form-group"><label>Password</label><input type="password" id="regPw1" placeholder="Create a strong password" autocomplete="new-password"/></div>
          <div class="form-group"><label>Confirm password</label><input type="password" id="regPw2" placeholder="Repeat your password" autocomplete="new-password"/></div>
          <div class="form-group">
            <label>Message <span style="color:var(--text3);font-weight:400;">(optional)</span></label>
            <input type="text" id="regMsg" placeholder="Why do you need access?"/>
          </div>
          <button class="btn btn-primary" id="submitBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Submit Request
          </button>
        </div>
        <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
      </div>

      <!-- Success -->
      <div id="successSection" style="display:none;text-align:center;">
        <div style="width:64px;height:64px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.22);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:1.75rem;">✓</div>
        <h1 class="auth-heading" style="font-size:1.4rem;">Request submitted</h1>
        <p class="auth-sub">Your account request has been sent to the administrator. You will be able to sign in once it is approved.</p>
        <a href="login.html" class="btn btn-primary" style="margin-top:0.5rem;text-decoration:none;display:inline-flex;">Go to Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (auth.getToken()) window.location.href = "dashboard.html";

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const pw1 = document.getElementById("regPw1").value;
      const pw2 = document.getElementById("regPw2").value;
      const msg = document.getElementById("regMsg").value.trim();
      const a = document.getElementById("alert");

      if (!name || !email || !pw1 || !pw2) { showAlert(a, "Please fill in all required fields."); return; }
      if (pw1 !== pw2) { showAlert(a, "Passwords do not match."); return; }
      if (pw1.length < 6) { showAlert(a, "Password must be at least 6 characters."); return; }

      const btn = document.getElementById("submitBtn");
      btn.textContent = "Submitting..."; btn.disabled = true; hideAlert(a);

      const res = await apiFetch("/api/user/request", {
        method: "POST",
        body: JSON.stringify({name, email, passwd1: pw1, passwd2: pw2, message: msg || null})
      });

      if (res && (res.ok || res.status === 204)) {
        document.getElementById("formSection").style.display = "none";
        document.getElementById("successSection").style.display = "block";
      } else {
        const d = await res.json();
        showAlert(a, d.detail || "Failed to submit request.");
        btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Submit Request`;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
